<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitare Pat · élève</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Version élève : lire et pratiquer seulement (décision de Pat, 3 nov. 2026). Rien ne se modifie. */
  :root { --bg:#14110e; --card:#1e1914; --ink:#f1e7d8; --mute:#a8977f; --line:#352c23; --accent:#e3a05c; --paper:#faf6ef; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter, Arial, sans-serif;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width:980px; margin:0 auto; padding-block:20px 140px; }
  .k { font:600 12px/1 Inter, Arial; letter-spacing:3px; text-transform:uppercase; color:var(--accent); }
  h1 { font:600 clamp(28px, 6vw, 42px)/1.1 Fraunces, Georgia, serif; margin:8px 0 4px; text-wrap:balance; }
  .sub { color:var(--mute); margin:0 0 18px; }
  .parties { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .parties button { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:9px 14px; font:600 14px Inter, Arial; cursor:pointer; }
  .parties button.on { background:var(--accent); border-color:var(--accent); color:#1b140c; }
  .vue { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .vue button { background:var(--card); color:var(--mute); border:0; padding:8px 12px; font:600 13px Inter, Arial; cursor:pointer; }
  .vue button.on { background:var(--ink); color:var(--bg); }
  .retour { color:var(--accent); text-decoration:none; font-weight:600; display:inline-block; margin-bottom:10px; }
  #cherche { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:16px Inter, Arial; margin:6px 0 14px; }
  #pieces { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  #pieces a { display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--ink); text-decoration:none; }
  #pieces a:hover { border-color:var(--accent); }
  #pieces b { font-weight:600; min-width:0; } #pieces span { color:var(--mute); font-size:14px; text-align:right; }
  .piste { margin:0 0 12px 12px; display:inline-flex; }
  .piste select { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font:14px Inter, Arial; max-width:60vw; }
  .aide { color:var(--mute); min-height:1.5em; margin:4px 0 14px; }
  #video { position:relative; aspect-ratio:16/9; max-width:100%; border-radius:12px; overflow:hidden; margin-bottom:14px; background:#000; }
  #video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #feuille { position:relative; z-index:0; isolation:isolate; background:var(--paper); border-radius:12px; overflow:hidden; min-height:200px; }
  .barre { position:fixed; z-index:1000; left:0; right:0; bottom:0; background:rgba(20,17,14,.96); border-top:1px solid var(--line);
           padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .barre .in { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; }
  #jouer { width:56px; height:56px; border-radius:50%; border:0; background:var(--accent); color:#1b140c; font-size:22px; cursor:pointer; flex:none; }
  #jouer:disabled { opacity:.4; }
  label { display:flex; align-items:center; gap:8px; color:var(--mute); font-size:14px; }
  input[type=range] { width:150px; accent-color:var(--accent); }
  #vit { color:var(--ink); font-weight:700; min-width:3.2em; }
  input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; }
  .consigne { margin-top:18px; border-left:3px solid var(--accent); padding:4px 14px; color:var(--mute); }
  .erreur { color:#f0a58a; }
</style>
</head>
<body>
<main>
  <section id="liste" hidden>
    <div class="k">Guitare Pat</div>
    <h1>Répertoire</h1>
    <input id="cherche" type="search" placeholder="Chercher une chanson ou un artiste" aria-label="Chercher">
    <ul id="pieces"></ul>
  </section>
  <section id="piece" hidden>
  <a class="retour" href="./">‹ Répertoire</a>
  <div class="k" id="genre">Guitare Pat · ton cours</div>
  <h1 id="titre">Chargement…</h1>
  <p class="sub" id="sous"></p>
  <div class="vue" id="vue" role="group" aria-label="Affichage">
    <button data-p="Default" class="on">Notation + tab</button><button data-p="Tab">Tab</button><button data-p="Score">Notation</button>
  </div>
  <label class="piste" id="pisteBox" hidden>Piste <select id="piste"></select></label>
  <div class="parties" id="parties"></div>
  <p class="aide" id="aide"></p>
  <div id="video" hidden></div>
  <div id="feuille"></div>
  <p class="consigne" id="consigne"></p>
  </section>
</main>
<div class="barre"><div class="in">
  <button id="jouer" disabled aria-label="Jouer">▶</button>
  <label>Vitesse <input id="vitesse" type="range" min="40" max="100" step="5" value="60"> <span id="vit">60 %</span></label>
  <label><input id="boucle" type="checkbox" checked> En boucle</label>
  <label><input id="metro" type="checkbox" checked> Métronome</label>
  <label><input id="decompte" type="checkbox"> Décompte</label>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.1/dist/alphaTab.js"></script>
<script>
const CDN = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.1/dist/';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const nom = (Q.get('cours') || '').replace(/[^\w-]/g, '');
const fichierPiece = Q.get('piece') || '';
const etroit = () => innerWidth < 700;
const api = new alphaTab.AlphaTabApi($('feuille'), {
  core: { fontDirectory: CDN + 'font/', scriptFile: CDN + 'alphaTab.js', engine: 'svg' },
  display: { scale: etroit() ? 0.75 : 1.0, layoutMode: 'Page', staveProfile: 'Default' },
  notation: { elements: { scoreTitle: false, scoreSubTitle: false, effectTempo: true, guitarTuning: false } },
  player: { enablePlayer: true, enableCursor: true, enableUserInteraction: false, soundFont: CDN + 'soundfont/sonivox.sf2' }
});
let cours = null, partie = -1, pieceInfo = null;

api.playerReady.on(() => { $('jouer').disabled = false; });
api.playerStateChanged.on(e => { $('jouer').textContent = e.state === 1 ? '❚❚' : '▶'; $('jouer').setAttribute('aria-label', e.state === 1 ? 'Pause' : 'Jouer'); });
api.scoreLoaded.on(score => {
  reglerSon();
  if (fichierPiece) preparerPiece(score);
  choisir(partie < 0 ? 0 : partie);
});

function reglerSon() {
  api.playbackSpeed = $('vitesse').value / 100;
  api.isLooping = $('boucle').checked;
  api.metronomeVolume = $('metro').checked ? 1 : 0;
  api.countInVolume = $('decompte').checked ? 1 : 0;
}
$('vitesse').oninput = () => { $('vit').textContent = $('vitesse').value + ' %'; reglerSon(); };
$('boucle').onchange = reglerSon;
$('metro').onchange = reglerSon;
$('decompte').onchange = reglerSon;
$('jouer').onclick = () => api.playPause();
// Affichage, comme la fenêtre de droite de Guitar Pro : notation + tab (par défaut), tab seule, notation seule
document.querySelectorAll('#vue button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#vue button').forEach(x => x.classList.toggle('on', x === b));
  api.settings.display.staveProfile = alphaTab.StaveProfile[b.dataset.p];
  api.updateSettings(); api.render();
});

// Une partie = des mesures (de..a, comptées à partir de 1) : on ne joue et ne boucle que celles-là
function choisir(i) {
  partie = i;
  const p = cours.parties[i], mb = api.score?.masterBars;
  [...$('parties').children].forEach((b, k) => b.classList.toggle('on', k === i));
  $('aide').textContent = p.aide || '';
  if (!mb) return;
  api.stop();
  const debut = mb[p.de - 1], fin = mb[Math.min(p.a, mb.length) - 1];
  api.playbackRange = { startTick: debut.start, endTick: fin.start + fin.calculateDuration() };
  api.tickPosition = debut.start;
}

// ---------- Un cours publié par Pat ----------
function ouvrirCours() {
  $('piece').hidden = false;
  fetch('cours/' + nom + '.json?' + Date.now()).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(c => {
    cours = c;
    document.title = c.titre + ' · ' + c.eleve;
    $('titre').textContent = c.titre;
    $('sous').textContent = c.eleve + ' · ' + c.date;
    $('consigne').textContent = c.consigne || '';
    boutonsParties();
    video(c.youtube);
    api.tex(c.tex);
  }).catch(() => { $('titre').textContent = 'Cours introuvable'; $('sous').innerHTML = '<span class="erreur">Vérifie le lien que Pat t’a envoyé.</span>'; });
}
function boutonsParties() {
  $('parties').innerHTML = '';
  cours.parties.forEach((p, i) => {
    const b = document.createElement('button');
    b.textContent = p.nom; b.onclick = () => choisir(i);
    $('parties').appendChild(b);
  });
}
// La vidéo YouTube de la chanson, au-dessus de la tab (idée de Pat)
function video(lien) {
  const yt = (lien || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (yt) { $('video').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}" title="Vidéo de la chanson" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`; $('video').hidden = false; }
}

// ---------- Une pièce du répertoire : le fichier Guitar Pro tel quel ----------
function ouvrirPiece() {
  $('piece').hidden = false;
  $('genre').textContent = 'Guitare Pat · répertoire';
  fetch('repertoire/index.json?' + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(liste => {
    pieceInfo = liste.find(p => p.fichier === fichierPiece) || { titre: fichierPiece.replace(/\.[^.]+$/, '') };
    $('titre').textContent = pieceInfo.titre;
    $('sous').textContent = pieceInfo.artiste || '';
    document.title = pieceInfo.titre;
    video(pieceInfo.youtube);
    api.load('repertoire/' + encodeURIComponent(fichierPiece));
  });
}
// Les parties : les sections du fichier (Intro, Couplet…) s'il y en a, sinon des blocs de 8 mesures
function preparerPiece(score) {
  // le titre et l'artiste écrits dans le fichier Guitar Pro passent avant ceux tirés du nom du fichier
  if (score.title) { $('titre').textContent = score.title; document.title = score.title; }
  if (score.artist) $('sous').textContent = score.artist;
  const mb = score.masterBars, parties = [{ nom: 'Tout', de: 1, a: mb.length }];
  const sec = mb.map((m, k) => m.section ? { nom: m.section.text || m.section.marker || 'Section', de: k + 1 } : null).filter(Boolean);
  if (sec.length) sec.forEach((p, k) => parties.push({ ...p, a: (sec[k + 1] ? sec[k + 1].de : mb.length + 1) - 1 }));
  else if (mb.length > 8) for (let d = 1; d <= mb.length; d += 8) parties.push({ nom: `Mesures ${d}–${Math.min(d + 7, mb.length)}`, de: d, a: Math.min(d + 7, mb.length) });
  cours = { parties };
  boutonsParties();
  if (!$('piste').options.length) {
    // une piste à l'écran (la guitare d'abord), toutes au son
    const pistes = score.tracks;
    $('piste').innerHTML = pistes.map((t, k) => `<option value="${k}">${t.name || 'Piste ' + (k + 1)}</option>`).join('');
    const guit = pistes.findIndex(t => /guit|gtr/i.test(t.name) && !/bass|basse/i.test(t.name));
    $('piste').value = guit >= 0 ? guit : 0;
    $('pisteBox').hidden = pistes.length < 2;
    if (guit > 0) api.renderTracks([pistes[guit]]);
  }
}
$('piste').onchange = () => api.renderTracks([api.score.tracks[+$('piste').value]]);

// ---------- La liste du répertoire ----------
const sansAccents = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function ouvrirListe() {
  $('liste').hidden = false;
  document.title = 'Guitare Pat · répertoire';
  fetch('repertoire/index.json?' + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(liste => {
    liste.sort((a, b) => ((a.artiste || '') + a.titre).localeCompare((b.artiste || '') + b.titre, 'fr'));
    const montrer = q => {
      const n = sansAccents(q);
      const vis = liste.filter(p => sansAccents(p.titre + ' ' + (p.artiste || '')).includes(n));
      $('pieces').innerHTML = vis.map(p => `<li><a href="?piece=${encodeURIComponent(p.fichier)}"><b>${p.titre}</b><span>${p.artiste || ''}</span></a></li>`).join('')
        || '<li class="aide">Aucune chanson pour l’instant.</li>';
    };
    $('cherche').oninput = () => montrer($('cherche').value);
    montrer('');
  });
}

if (nom) ouvrirCours(); else if (fichierPiece) ouvrirPiece(); else ouvrirListe();
</script>
</body>
</html>
